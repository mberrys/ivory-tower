name: ivory-tower

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ivory_tower
      POSTGRES_USER: ivory
      POSTGRES_PASSWORD: ivory
    ports:
      - "5432:5432"
    volumes:
      - ../.ivory-tower/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivory -d ivory_tower"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ivory
      MINIO_ROOT_PASSWORD: ivory-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../.ivory-tower/minio:/data

  object-store-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - object-store
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://object-store:9000 ivory ivory-development-only; do sleep 1; done
        mc mb --ignore-existing local/ivory-tower

  docling:
    image: ghcr.io/docling-project/docling-serve:v1.21.0
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_HOST: 0.0.0.0
      DOCLING_SERVE_PORT: 5001

# The API and worker run from the workspace so package tests and source maps
# remain available. Start them after `npm run migrate:ivory` with the root
# `start:ivory-api` and `start:ivory-worker` scripts.
